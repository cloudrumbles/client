[package]
name = "pomme-web-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Deliberately portable: the native Vulkan workspace pulls in platform-specific
# networking, rendering and window libraries that a browser cannot load.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
